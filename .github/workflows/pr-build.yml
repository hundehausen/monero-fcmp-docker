name: "Test image build on pull request"

on:
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - healthcheck.sh
      - .github/workflows/pr-build.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TEST_IMAGE: monero-fcmp:pr-test

jobs:
  build:
    name: "Build test image (${{ matrix.arch }}) and delete it"
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          provenance: false
          sbom: false
          platforms: ${{ matrix.platform }}
          tags: ${{ env.TEST_IMAGE }}

      - name: Check monerod version
        run: timeout 60 docker run --rm "${TEST_IMAGE}" --version

      - name: Check RPC healthcheck
        run: |
          set -eu
          name="monerod-hc"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # These args replace the image CMD. Keep the restricted testnet
          # port and stay offline so the probe checks RPC without syncing.
          docker run -d --name "$name" "${TEST_IMAGE}" \
            --testnet \
            --offline \
            --rpc-restricted-bind-ip=0.0.0.0 \
            --rpc-restricted-bind-port=28089 \
            --no-igd \
            --no-zmq \
            --ban-list=/home/monero/ban_list.txt
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name")"
            case "$status" in
              healthy) exit 0 ;;
              unhealthy)
                docker logs "$name" || true
                exit 1
                ;;
            esac
            if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
              docker logs "$name" || true
              exit 1
            fi
            sleep 5
          done
          docker logs "$name" || true
          exit 1

      - name: Delete test image
        run: |
          docker image rm "${TEST_IMAGE}"
          docker image prune --force
          docker buildx prune --force --all
